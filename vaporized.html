<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vaporized — VR Theater Experience</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- WebXR Required Meta Tags -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Preload critical assets -->
<link rel="preload" href="assets/audio/intro.mp3" as="audio">
<link rel="preload" href="assets/audio/reward_cheer.mp3" as="audio">
<link rel="preload" href="assets/audio/sad_crowd.mp3" as="audio">
<link rel="preload" href="assets/00_intro_1080p24.mp4" as="video">
<link rel="preload" href="assets/01_parking_offer_1080p24.mp4" as="video">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
  :root {
    --bg:#000; --fg:#fff; --muted:#bbb;
    --accent:#23c2ff; --warn:#6a2c2c; --card:#111; --border:#333;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Arial;overflow:hidden}

  /* Loading Screen */
  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10004;
    flex-direction: column;
  }
  
  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: var(--accent);
    animation: spin 1s ease-in-out infinite;
    margin-bottom: 20px;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* 2D Fallback Mode */
  #fallback-mode {
    position: fixed;
    inset: 0;
    display: none;
    z-index: 10000;
  }

  /* VR Theater will be handled by A-Frame */
  a-scene {
    position: fixed;
    inset: 0;
    z-index: 1;
  }
</style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading Vaporized VR Experience...</div>
  </div>

  <!-- 2D Fallback Mode (hidden initially) -->
  <div id="fallback-mode">
    <!-- Your existing 2D content would go here as fallback -->
  </div>

  <!-- VR Theater Experience -->
  <a-scene 
      background="color: #000000"
      renderer="colorManagement: true; antialias: true"
      xr-mode-ui="enabled: true"
      vr-mode-ui="enabled: true"
  >
    <!-- Assets -->
    <a-assets>
      <video id="introVideo" src="assets/00_intro_1080p24.mp4" preload="auto" crossorigin="anonymous"></video>
      <video id="parkingVideo" src="assets/01_parking_offer_1080p24.mp4" preload="auto" crossorigin="anonymous"></video>
      <audio id="introMusic" src="assets/audio/intro.mp3" preload="auto"></audio>
      <audio id="cheeringCrowd" src="assets/audio/reward_cheer.mp3" preload="auto"></audio>
      <audio id="sadCrowd" src="assets/audio/sad_crowd.mp3" preload="auto"></audio>
    </a-assets>

    <!-- Camera Rig -->
    <a-entity id="rig" position="0 1.6 0">
      <a-entity id="cam" 
                camera="near: 0.01; far: 1000; fov: 80"
                look-controls="pointerLockEnabled: true"
                wasd-controls="enabled: false"
                position="0 0 0">
      </a-entity>
    </a-entity>

    <!-- VR Theater Environment -->
    <a-entity id="theater-environment" visible="true">
      <!-- Giant Presentation Screen -->
      <a-video id="presentation-screen"
               position="0 3 -8"
               width="16"
               height="9"
               src="#introVideo">
      </a-video>

      <!-- Theater Environment -->
      <a-entity position="0 -1 -8">
        <!-- Stage -->
        <a-box position="0 -0.5 0" width="20" height="1" depth="2" color="#333333"></a-box>
        
        <!-- Screen Frame -->
        <a-box position="0 3 -7.9" width="16.2" height="9.2" depth="0.2" color="#111111"></a-box>
        <a-box position="0 3 -7.8" width="16.4" height="9.4" depth="0.1" color="#444444"></a-box>
      </a-entity>

      <!-- Lighting -->
      <a-entity light="type: ambient; intensity: 0.3; color: #FFFFFF"></a-entity>
      <a-entity light="type: directional; intensity: 0.7; color: #FFFFFF" position="5 5 5"></a-entity>
      <a-entity light="type: spot; intensity: 0.8; angle: 30; penumbra: 0.5; color: #FFFFFF" 
               position="0 8 -4" target="#presentation-screen"></a-entity>
    </a-entity>

    <!-- Star Wars Intro in VR -->
    <a-entity id="starwars-intro" visible="false">
      <a-entity position="0 0 -10" rotation="0 0 0">
        <a-text value="VAPORIZED" 
                position="0 4 0" 
                align="center" 
                color="#ffd700" 
                scale="3 3 1"
                animation="property: position; to: 0 8 -20; dur: 30000; easing: linear">
        </a-text>
        <a-text value="A Vape Breakers Production" 
                position="0 2 0" 
                align="center" 
                color="#ffd700" 
                scale="2 2 1"
                animation="property: position; to: 0 6 -20; dur: 30000; easing: linear">
        </a-text>
        <a-text value="In a world where vaping has become an epidemic..." 
                position="0 0 0" 
                align="center" 
                color="#ffffff" 
                width="8"
                scale="1.5 1.5 1"
                animation="property: position; to: 0 4 -20; dur: 30000; easing: linear">
        </a-text>
      </a-entity>
    </a-entity>

    <!-- Choice Interface in VR -->
    <a-entity id="choice-interface" visible="false" position="0 2 -3">
      <a-text value="Make Your Choice" 
              position="0 2 0" 
              align="center" 
              color="#23c2ff" 
              scale="2 2 1">
      </a-text>
      
      <!-- Take a Puff Button -->
      <a-box id="btn-vr" 
             position="-2 0 0" 
             width="2" 
             height="0.5" 
             depth="0.1" 
             color="#23c2ff"
             class="clickable">
        <a-text value="Take a Puff" 
                position="0 0 0.06" 
                align="center" 
                color="#000" 
                scale="1.5 1.5 1">
        </a-text>
      </a-box>
      
      <!-- No Thanks Button -->
      <a-box id="btn-no" 
             position="2 0 0" 
             width="2" 
             height="0.5" 
             depth="0.1" 
             color="#6a2c2c"
             class="clickable">
        <a-text value="No, Thanks" 
                position="0 0 0.06" 
                align="center" 
                color="#fff" 
                scale="1.5 1.5 1">
        </a-text>
      </a-box>
    </a-entity>

    <!-- Consequence Overlays in VR -->
    <a-entity id="negative-consequence" visible="false" position="0 2 -2">
      <a-plane position="0 0 0" width="6" height="4" color="#111111" opacity="0.9"></a-plane>
      <a-text value="Immediate Impact" 
              position="0 1.5 0.1" 
              align="center" 
              color="#ff6b6b" 
              scale="1.5 1.5 1">
      </a-text>
      <a-text value="Nicotine enters your bloodstream..." 
              position="0 0 0.1" 
              align="center" 
              width="5"
              color="#ffffff" 
              scale="1 1 1">
      </a-text>
      <a-box id="negative-continue" 
             position="0 -1.5 0.1" 
             width="2" 
             height="0.4" 
             depth="0.1" 
             color="#ff4d4d"
             class="clickable">
        <a-text value="Continue" 
                position="0 0 0.06" 
                align="center" 
                color="#fff" 
                scale="1 1 1">
        </a-text>
      </a-box>
    </a-entity>

    <a-entity id="positive-consequence" visible="false" position="0 2 -2">
      <a-plane position="0 0 0" width="6" height="4" color="#111111" opacity="0.9"></a-plane>
      <a-text value="Smart Choice!" 
              position="0 1.5 0.1" 
              align="center" 
              color="#4CAF50" 
              scale="1.5 1.5 1">
      </a-text>
      <a-text value="You avoided harmful chemicals..." 
              position="0 0 0.1" 
              align="center" 
              width="5"
              color="#ffffff" 
              scale="1 1 1">
      </a-text>
      <a-box id="positive-continue" 
             position="0 -1.5 0.1" 
             width="2" 
             height="0.4" 
             depth="0.1" 
             color="#4CAF50"
             class="clickable">
        <a-text value="Continue" 
                position="0 0 0.06" 
                align="center" 
                color="#fff" 
                scale="1 1 1">
        </a-text>
      </a-box>
    </a-entity>

    <!-- Continue to Classroom Button -->
    <a-entity id="continue-button" visible="false" position="0 1 -2">
      <a-box id="btn-continue" 
             position="0 0 0" 
             width="3" 
             height="0.5" 
             depth="0.1" 
             color="#4CAF50"
             class="clickable">
        <a-text value="Continue to Classroom" 
                position="0 0 0.06" 
                align="center" 
                color="#fff" 
                scale="1.2 1.2 1">
        </a-text>
      </a-box>
    </a-entity>
  </a-scene>

<script>
  // -------- Paths ----------
  const TO_VR = 'journeys/mouth_final.html';
  const TO_CLASSROOM = '../vape_on_the_brain_vr/Classroom/classroom_scene.html';

  // -------- State ----------
  let currentScene = 0;
  let cheeringAudioPlayed = false;
  let sadAudioPlayed = false;

  // -------- DOM Elements ----------
  const loading = document.getElementById('loading');
  const fallbackMode = document.getElementById('fallback-mode');

  // -------- A-Frame Elements ----------
  const scene = document.querySelector('a-scene');
  const theater = document.getElementById('theater-environment');
  const starwarsIntro = document.getElementById('starwars-intro');
  const choiceInterface = document.getElementById('choice-interface');
  const negativeConsequence = document.getElementById('negative-consequence');
  const positiveConsequence = document.getElementById('positive-consequence');
  const continueButton = document.getElementById('continue-button');
  const presentationScreen = document.getElementById('presentation-screen');

  // -------- Audio Elements ----------
  const introMusic = document.querySelector('#introMusic');
  const cheeringCrowd = document.querySelector('#cheeringCrowd');
  const sadCrowd = document.querySelector('#sadCrowd');
  const introVideo = document.querySelector('#introVideo');
  const parkingVideo = document.querySelector('#parkingVideo');

  // -------- Scene Sequence ----------
  const scenes = [
    { type: 'starwars', duration: 10000 },
    { type: 'video', video: '#introVideo', duration: 45000 },
    { type: 'video', video: '#parkingVideo', duration: 30000 },
    { type: 'choice', duration: 0 } // Wait for user input
  ];

  // -------- Utility Functions ----------
  function hideLoading() {
    loading.style.display = 'none';
  }

  function showScene(sceneElement) {
    // Hide all scenes
    theater.setAttribute('visible', 'false');
    starwarsIntro.setAttribute('visible', 'false');
    choiceInterface.setAttribute('visible', 'false');
    negativeConsequence.setAttribute('visible', 'false');
    positiveConsequence.setAttribute('visible', 'false');
    continueButton.setAttribute('visible', 'false');
    
    // Show requested scene
    sceneElement.setAttribute('visible', 'true');
  }

  function playAudio(audioElement) {
    audioElement.play().catch(e => {
      console.log('Audio play failed, will retry on interaction:', e);
    });
  }

  function playVideo(videoAsset) {
    const video = document.querySelector(videoAsset);
    if (video) {
      video.play();
      return new Promise(resolve => {
        video.onended = resolve;
        setTimeout(resolve, scenes[currentScene].duration);
      });
    }
    return Promise.resolve();
  }

  // -------- Main Experience Flow ----------
  async function startExperience() {
    console.log("🚀 Starting VR Theater Experience");
    
    // Wait for A-Frame to load
    await new Promise(resolve => {
      scene.addEventListener('loaded', resolve);
    });

    // Play intro music
    playAudio(introMusic);

    // Star Wars Intro
    showScene(starwarsIntro);
    await new Promise(resolve => setTimeout(resolve, 10000));

    // Intro Video
    showScene(theater);
    presentationScreen.setAttribute('src', '#introVideo');
    await playVideo('#introVideo');

    // Parking Video
    presentationScreen.setAttribute('src', '#parkingVideo');
    await playVideo('#parkingVideo');

    // Show Choice Interface
    showScene(choiceInterface);
  }

  // -------- Event Handlers ----------
  function setupEventHandlers() {
    // VR Choice - Take a Puff
    document.getElementById('btn-vr').addEventListener('click', () => {
      showScene(negativeConsequence);
      playAudio(sadCrowd);
    });

    // VR Choice - No Thanks
    document.getElementById('btn-no').addEventListener('click', () => {
      showScene(positiveConsequence);
      playAudio(cheeringCrowd);
    });

    // Negative Consequence Continue
    document.getElementById('negative-continue').addEventListener('click', () => {
      window.location.href = TO_VR;
    });

    // Positive Consequence Continue
    document.getElementById('positive-continue').addEventListener('click', () => {
      window.location.href = TO_VR;
    });

    // Continue to Classroom
    document.getElementById('btn-continue').addEventListener('click', () => {
      window.location.href = TO_CLASSROOM;
    });
  }

  // -------- Initialize ----------
  async function init() {
    try {
      // Check if WebXR is supported
      if (navigator.xr) {
        const supported = await navigator.xr.isSessionSupported('immersive-vr');
        if (!supported) {
          // Fallback to 2D mode
          fallbackMode.style.display = 'block';
          scene.style.display = 'none';
          // You would initialize your original 2D experience here
          console.log("WebXR not supported, falling back to 2D");
          hideLoading();
          return;
        }
      }

      // Start VR experience
      setupEventHandlers();
      await startExperience();
      hideLoading();

    } catch (error) {
      console.error('Initialization failed:', error);
      hideLoading();
      // Fallback to 2D mode
      fallbackMode.style.display = 'block';
      scene.style.display = 'none';
    }
  }

  // Start when ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // Handle body journey completion
  window.addEventListener('pageshow', function(event) {
    if (sessionStorage.getItem('bodyJourneyCompleted')) {
      continueButton.setAttribute('visible', 'true');
      sessionStorage.removeItem('bodyJourneyCompleted');
    }
  });
</script>
</body>
</html>
