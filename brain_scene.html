<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vaporized — Brain Scene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body { margin:0; height:100%; background:#000; font-family:system-ui,Segoe UI,Arial; overflow: hidden; }
    .whiteboard{
      position:fixed; left:12px; top:18px; width:420px; max-width:40vw; z-index:1200;
      background:rgba(248, 251, 255, 0.95); border:2px solid #dbe7ff; border-radius:14px; box-shadow:0 6px 18px rgba(0,0,0,.30);
      padding:14px 16px; backdrop-filter: blur(10px);
    }
    .whiteboard h2{ margin:0 0 10px 0; font-size:20px; color:#0f172a }
    .answers{ display:grid; gap:6px }
    .ans{ background:#ffffff; border:1px solid #d7e3ff; border-radius:10px; padding:10px 12px; color:#0b1a33; cursor:pointer; transition: all 0.2s ease; }
    .ans:hover { background:#f0f7ff; transform: translateY(-1px); }
    .ans strong{ margin-right:6px }
    .ans.active{ border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,.25) inset; background:#f0f7ff }
    .ans.recording{ border-color:#ef4444; box-shadow:0 0 0 2px rgba(239,68,68,.25) inset; background:#fef2f2 }
    .ans.done{ opacity:.85 }
    .callout-box{
      position:fixed; right:12px; top:18px; z-index:1100; width:360px; max-width:32vw;
      background:rgba(17, 17, 17, 0.95); color:#fff; border-radius:12px; border:1px solid #333; padding:14px 16px; display:none;
      box-shadow:0 8px 28px rgba(0,0,0,.45); text-align:left; backdrop-filter: blur(10px);
    }
    .callout-box h3{ margin:0 0 6px 0; font-size:18px; color:#ffd700 }
    .callout-box p{ margin:0; line-height:1.35; color:#cfd8e3 }
    #leaderOverlay{ position:fixed; left:0; top:0; width:100vw; height:100vh; z-index:1099; pointer-events:none; display:none; }
    .cta{position:fixed; left:50%; transform:translateX(-50%); bottom:28px; z-index:1200; display:none;}
    .cta button{background:#0f1220;color:#cfe8ff;border:1px solid #243159;border-radius:12px;padding:12px 18px;font-size:18px;cursor:pointer}
    .cta button:hover{background:#182242}
    #statusDot{ position:fixed; right:12px; bottom:12px; z-index:1200; width:10px; height:10px; border-radius:50%; background:#2aa54a; border:1px solid #511; }
    
    /* VR Controls Help */
    .vr-controls-help{
      position:fixed; left:50%; transform:translateX(-50%); bottom:20px; z-index:1200; 
      background:rgba(0,0,0,0.8); border:1px solid #444; border-radius:10px; padding:12px 16px;
      font-size:14px; color:#fff; text-align:center; backdrop-filter: blur(10px);
    }
    .vr-controls-help strong{ color:#ffd700; display:block; margin-bottom:4px; }
    
    /* Fade transition */
    .fade-out{ animation:fade 0.9s forwards }
    @keyframes fade { to { opacity:0; transform:scale(.96) } }

    /* 3D Navigation Hints */
    .nav-hint {
      position: fixed;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 1200;
      display: none;
    }
    #hint-rotate { top: 20px; right: 20px; }
    #hint-zoom { bottom: 80px; left: 20px; }
  </style>
</head>
<body>

<div class="whiteboard" id="wb">
  <h2 id="wbQ">How does vaping affect the adolescent brain?</h2>
  <div class="answers">
    <div class="ans" id="wbA"><strong>A.</strong> Poor concentration</div>
    <div class="ans" id="wbB"><strong>B.</strong> Impaired learning & memory</div>
    <div class="ans" id="wbC"><strong>C.</strong> Increased risk of addiction</div>
    <div class="ans" id="wbD"><strong>D.</strong> Mood swings & anxiety</div>
  </div>
</div>

<div id="callout" class="callout-box">
  <h3 id="callTitle">Title</h3>
  <p id="callBody">Body text</p>
</div>

<svg id="leaderOverlay">
  <line id="leader" x1="0" y1="0" x2="0" y2="0" stroke="#ffd700" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,4"/>
  <circle id="leaderDot" cx="0" cy="0" r="6" fill="#ff4444" stroke="#800" stroke-width="2" />
</svg>

<div id="statusDot"></div>

<!-- VR Controls Help -->
<div class="vr-controls-help" id="vrControls">
  <strong>VR Controls</strong>
  <div>Grip: Rotate Brain • Trigger: Zoom • A/X: Next Scene</div>
</div>

<!-- Navigation Hints -->
<div class="nav-hint" id="hint-rotate">Drag to Rotate • Scroll to Zoom</div>

<div class="cta" id="ctaBox"><button id="ctaBtn">Continue to Next Scene</button></div>

<a-scene 
  renderer="antialias:true; physicallyCorrectLights:true; colorManagement:true; toneMapping:ACESFilmic;"
  background="color:#000" 
  shadow="type: pcfsoft" 
  vr-mode-ui="enabled:true"
  cursor="rayOrigin: mouse"
  raycaster="objects: .clickable">
  
  <a-assets timeout="60000">
    <a-asset-item id="brainModel" src="./assets/models/Brain.glb"></a-asset-item>
    <audio id="clickSound" src="./assets/audio/click.mp3" preload="auto"></audio>
  </a-assets>

  <!-- Space Environment -->
  <a-sky color="#0a0a1f"></a-sky>
  
  <!-- Floating particles for depth -->
  <a-entity id="particles"></a-entity>

  <a-entity id="rig" position="0 1.6 0">
    <a-entity id="cam" camera="fov: 80" look-controls="pointerLockEnabled: true"></a-entity>
  </a-entity>

  <!-- Enhanced Lighting -->
  <a-entity light="type: ambient; intensity: 0.4; color:#1a237e"></a-entity>
  <a-entity light="type: directional; intensity: 1.0; color:#ffffff" position="3 5 3" shadow="cast:true; shadowMapSize: 1024"></a-entity>
  <a-entity light="type: point; intensity: 0.8; color:#4fc3f7" position="-2 3 -1" distance="8"></a-entity>
  <a-entity light="type: point; intensity: 0.6; color:#ff4081" position="2 2 2" distance="6"></a-entity>

  <!-- Interactive Brain with better physics -->
  <a-entity id="brain-rig" position="0 1.2 -3">
    <a-entity id="brain" 
              gltf-model="#brainModel" 
              position="0 0 0" 
              rotation="0 0 0" 
              scale="1.2 1.2 1.2" 
              shadow="cast:true; receive:true"
              class="clickable"
              animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 40000; easing: linear; pauseEvents: mouseenter">
    </a-entity>
  </a-entity>

  <!-- Visual indicator for placed dot -->
  <a-entity id="placement-dot" visible="false">
    <a-sphere radius="0.03" color="#ff4444" emissive="#ff0000" emissiveIntensity="0.5"></a-sphere>
    <a-ring radius="0.05" color="#ff4444" opacity="0.3" rotation="-90 0 0"></a-ring>
  </a-entity>

  <!-- VR Controllers -->
  <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
  <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>

  <!-- Floating info panels that appear in VR -->
  <a-entity id="vr-info" position="0 2.5 -2" visible="false">
    <a-text value="Look at different brain areas" color="#ffd700" align="center" position="0 0.3 0"></a-text>
    <a-plane color="#000" opacity="0.8" width="1.8" height="0.8" position="0 0 0"></a-plane>
  </a-entity>
</a-scene>

<script>
// Enhanced 3D Brain Experience
(function() {
  'use strict';
  
  let sceneInitialized = false;
  const brain = document.getElementById('brain');
  const scene = document.querySelector('a-scene');
  const brainRig = document.getElementById('brain-rig');
  
  // Auto-rotate brain slowly when not interacting
  let autoRotate = true;
  let isInteracting = false;

  function tryLoadModel() {
    const modelPaths = [
      './assets/models/Brain.glb',
      '../assets/models/Brain.glb', 
      'assets/models/Brain.glb',
      './assets/models/brain.glb'
    ];

    let attempts = 0;
    
    function attemptLoad() {
      if (attempts >= modelPaths.length) {
        createFallbackBrain();
        return;
      }
      
      brain.setAttribute('gltf-model', modelPaths[attempts]);
      attempts++;
    }

    brain.addEventListener('model-loaded', function() {
      if (sceneInitialized) return;
      
      const mesh = brain.getObject3D('mesh');
      if (mesh) {
        mesh.traverse(function(node) {
          if (node.isMesh && node.material) {
            // Enhanced brain materials for VR
            if (node.material.color) {
              node.material.color.set('#ff6b9d');
            }
            node.material.emissive = new THREE.Color(0x331122);
            node.material.emissiveIntensity = 0.1;
            if ('metalness' in node.material) node.material.metalness = 0.3;
            if ('roughness' in node.material) node.material.roughness = 0.4;
            node.material.needsUpdate = true;
          }
        });
      }
      sceneInitialized = true;
      initializeApplication();
    });

    brain.addEventListener('model-error', function() {
      setTimeout(attemptLoad, 500);
    });

    attemptLoad();
  }

  function createFallbackBrain() {
    // Create a more interesting fallback brain
    brain.innerHTML = '';
    brain.setAttribute('geometry', 'primitive: sphere; radius: 0.5');
    brain.setAttribute('material', 'color: #ff6b9d; metalness: 0.3; roughness: 0.4; emissive: #331122; emissiveIntensity: 0.1');
    sceneInitialized = true;
    initializeApplication();
  }

  // Start loading
  tryLoadModel();

  setTimeout(function() {
    if (!sceneInitialized) {
      sceneInitialized = true;
      initializeApplication();
    }
  }, 3000);

})();

function initializeApplication() {
  'use strict';
  
  if (window.brainAppInitialized) return;
  window.brainAppInitialized = true;
  
  // DOM Elements
  const call = document.getElementById('callout');
  const title = document.getElementById('callTitle');
  const body = document.getElementById('callBody');
  const svg = document.getElementById('leaderOverlay');
  const line = document.getElementById('leader');
  const dot2D = document.getElementById('leaderDot');
  const ctaBox = document.getElementById('ctaBox');
  const ctaBtn = document.getElementById('ctaBtn');
  const wbA = document.getElementById('wbA'), wbB = document.getElementById('wbB'), wbC = document.getElementById('wbC'), wbD = document.getElementById('wbD');
  const placementDot = document.getElementById('placement-dot');
  const brainRig = document.getElementById('brain-rig');
  const brain = document.getElementById('brain');
  const scene = document.querySelector('a-scene');
  const vrControls = document.getElementById('vrControls');
  const vrInfo = document.getElementById('vr-info');

  // Enhanced 3D Controls
  let isRotating = false;
  let lastMouseX = 0;
  let lastMouseY = 0;
  let brainRotation = { x: 0, y: 0 };
  let brainScale = 1;
  const SCALE_MIN = 0.5;
  const SCALE_MAX = 2.0;

  // Mouse/Touch Controls for 3D Interaction
  scene.addEventListener('mousedown', startRotation);
  scene.addEventListener('touchstart', startRotation);
  
  function startRotation(e) {
    isRotating = true;
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    lastMouseX = clientX;
    lastMouseY = clientY;
    
    // Stop auto-rotation during interaction
    brain.removeAttribute('animation__rotate');
    
    document.addEventListener('mousemove', rotateBrain);
    document.addEventListener('touchmove', rotateBrain);
    document.addEventListener('mouseup', stopRotation);
    document.addEventListener('touchend', stopRotation);
  }

  function rotateBrain(e) {
    if (!isRotating) return;
    
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    const deltaX = clientX - lastMouseX;
    const deltaY = clientY - lastMouseY;
    
    brainRotation.y += deltaX * 0.5;
    brainRotation.x += deltaY * 0.5;
    
    // Limit vertical rotation
    brainRotation.x = Math.max(-90, Math.min(90, brainRotation.x));
    
    brainRig.object3D.rotation.set(
      THREE.MathUtils.degToRad(brainRotation.x),
      THREE.MathUtils.degToRad(brainRotation.y),
      0
    );
    
    lastMouseX = clientX;
    lastMouseY = clientY;
  }

  function stopRotation() {
    isRotating = false;
    document.removeEventListener('mousemove', rotateBrain);
    document.removeEventListener('touchmove', rotateBrain);
    
    // Restart auto-rotation after a delay
    setTimeout(() => {
      if (!isRotating) {
        brain.setAttribute('animation__rotate', {
          property: 'rotation',
          to: `0 ${brainRotation.y + 360} 0`,
          dur: 40000,
          easing: 'linear'
        });
      }
    }, 2000);
  }

  // Enhanced Zoom with Scroll
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
    brainScale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, brainScale * zoomFactor));
    
    brainRig.object3D.scale.set(brainScale, brainScale, brainScale);
  }, { passive: false });

  // VR Controller Support
  scene.addEventListener('enter-vr', function() {
    vrControls.style.display = 'block';
    vrInfo.setAttribute('visible', 'true');
    
    // Enhance VR experience
    brain.setAttribute('scale', '1.5 1.5 1.5');
  });

  scene.addEventListener('exit-vr', function() {
    vrControls.style.display = 'none';
    vrInfo.setAttribute('visible', 'false');
    brain.setAttribute('scale', '1.2 1.2 1.2');
  });

  // Answer data with enhanced 3D positions
  const answerData = {
    A: {
      title: 'Prefrontal Cortex — Attention & Control',
      body: 'Nicotine disrupts executive control in the prefrontal cortex, degrading sustained attention and focus.',
      narration: "./assets/audio/vo/vo_A.mp3",
      position: { x: 0.3, y: 0.4, z: 0.2 },
      view: { rotationX: 20, rotationY: 30, scale: 1.3 }
    },
    B: {
      title: 'Hippocampus — Learning & Memory',
      body: 'Repeated nicotine exposure impairs hippocampal plasticity, affecting learning and memory formation.',
      narration: "./assets/audio/vo/vo_B.mp3", 
      position: { x: -0.2, y: 0.1, z: 0.3 },
      view: { rotationX: -10, rotationY: -20, scale: 1.4 }
    },
    C: {
      title: 'Nucleus Accumbens — Reward & Addiction',
      body: 'Nicotine drives dopamine surges in reward pathways, significantly increasing addiction vulnerability.',
      narration: "./assets/audio/vo/vo_C.mp3",
      position: { x: 0.1, y: -0.2, z: 0.4 },
      view: { rotationX: 15, rotationY: 45, scale: 1.5 }
    },
    D: {
      title: 'Amygdala — Mood & Anxiety',
      body: 'Withdrawal and nicotine effects on amygdala contribute to mood instability and heightened anxiety.',
      narration: "./assets/audio/vo/vo_D.mp3",
      position: { x: -0.3, y: 0.2, z: -0.1 },
      view: { rotationX: -5, rotationY: -40, scale: 1.6 }
    }
  };

  // Enhanced click handling for brain
  brain.addEventListener('click', function(ev) {
    if (ev.detail && ev.detail.intersection) {
      const point = ev.detail.intersection.point;
      
      // Place the dot with visual feedback
      placementDot.object3D.position.copy(point);
      placementDot.setAttribute('visible', 'true');
      
      // Add animation
      placementDot.setAttribute('animation', {
        property: 'scale',
        from: '0 0 0',
        to: '1 1 1',
        dur: 300,
        easing: 'easeOutElastic'
      });
      
      // Show leader line to callout
      showLeaderLine(point);
      
      // Play click sound if available
      const clickSound = document.getElementById('clickSound');
      if (clickSound) {
        clickSound.currentTime = 0;
        clickSound.play().catch(() => {});
      }
    }
  });

  function showLeaderLine(worldPosition) {
    function drawLeader() {
      const p = projectToScreen(worldPosition);
      const a = panelAnchor2D();
      if (line && dot2D) {
        line.setAttribute('x1', a.x); 
        line.setAttribute('y1', a.y);
        line.setAttribute('x2', p.x); 
        line.setAttribute('y2', p.y);
        dot2D.setAttribute('cx', p.x); 
        dot2D.setAttribute('cy', p.y);
        requestAnimationFrame(drawLeader);
      }
    }
    
    svg.style.display = 'block';
    drawLeader();
  }

  // Auto-play sequence with enhanced 3D animations
  function playScene(id) {
    return new Promise((resolve) => {
      const data = answerData[id];
      if (!data) return resolve(0);
      
      // Animate to the target view
      animateToView(data.view, data.position).then(() => {
        setActiveWB(id);
        title.textContent = data.title;
        body.textContent = data.body;
        call.style.display = 'block';
        
        // Convert local position to world position for the dot
        const worldPos = brain.object3D.localToWorld(
          new THREE.Vector3(data.position.x, data.position.y, data.position.z)
        );
        showLeaderLine(worldPos);
        
        // Play narration
        const audio = new Audio(data.narration);
        audio.onended = () => resolve(audio.duration);
        audio.onerror = () => resolve(0);
        audio.play().catch(() => resolve(0));
      });
    });
  }

  function animateToView(view, dotPosition) {
    return new Promise((resolve) => {
      const targetRotation = {
        x: THREE.MathUtils.degToRad(view.rotationX || 0),
        y: THREE.MathUtils.degToRad(view.rotationY || 0),
        z: 0
      };
      
      const targetScale = view.scale || 1;
      
      // Animate rotation and scale
      brainRig.setAttribute('animation', {
        property: 'rotation',
        to: `${targetRotation.x} ${targetRotation.y} ${targetRotation.z}`,
        dur: 1500,
        easing: 'easeInOutQuad'
      });
      
      brainRig.setAttribute('animation__scale', {
        property: 'scale',
        to: `${targetScale} ${targetScale} ${targetScale}`,
        dur: 1500,
        easing: 'easeInOutQuad'
      });
      
      // Place dot at target position
      placementDot.object3D.position.copy(
        brain.object3D.localToWorld(
          new THREE.Vector3(dotPosition.x, dotPosition.y, dotPosition.z)
        )
      );
      placementDot.setAttribute('visible', 'true');
      
      setTimeout(resolve, 1600);
    });
  }

  // Auto-run the experience
  setTimeout(() => {
    const sceneOrder = ['A', 'B', 'C', 'D'];
    let currentScene = 0;
    
    function playNextScene() {
      if (currentScene >= sceneOrder.length) {
        ctaBox.style.display = 'block';
        return;
      }
      
      playScene(sceneOrder[currentScene]).then(() => {
        currentScene++;
        setTimeout(playNextScene, 2000);
      });
    }
    
    playNextScene();
  }, 2000);

  // Utility functions
  function setActiveWB(id) {
    [wbA, wbB, wbC, wbD].forEach(el => el.classList.remove('active'));
    document.getElementById(`wb${id}`).classList.add('active');
  }

  function projectToScreen(v3) {
    const cam = scene.camera; 
    const v = v3.clone().project(cam);
    return { 
      x: (v.x * 0.5 + 0.5) * window.innerWidth, 
      y: (-v.y * 0.5 + 0.5) * window.innerHeight 
    };
  }

  function panelAnchor2D() {
    const r = call.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // CTA handler
  ctaBtn.addEventListener('click', () => {
    document.body.classList.add('fade-out');
    setTimeout(() => { 
      window.location.href = 'classroom_scene.html';
    }, 900);
  });

  // Add floating particles for depth
  createParticles();
  
  function createParticles() {
    const particles = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
      const particle = document.createElement('a-entity');
      particle.setAttribute('geometry', 'primitive: sphere; radius: 0.02');
      particle.setAttribute('material', 'color: #4fc3f7; transparent: true; opacity: 0.3');
      particle.setAttribute('position', {
        x: (Math.random() - 0.5) * 10,
        y: (Math.random() - 0.5) * 10, 
        z: (Math.random() - 0.5) * 10
      });
      particles.appendChild(particle);
    }
  }
}
</script>
</body>
</html>
