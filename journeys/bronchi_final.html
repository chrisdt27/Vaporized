<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bronchi – VR Optimized for Oculus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, minimum-scale=1, maximum-scale=1"/>
  <!-- A-Frame 1.5.0 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body { margin:0; height:100%; background:#000; overflow: hidden; }
    #err{
      position:fixed; left:0; right:0; bottom:0;
      color:#fff; background:rgba(200,0,0,.25);
      font:12px/1.4 monospace; padding:6px 8px; display:none;
      white-space:pre-wrap; pointer-events:none;
    }
    
    /* VR-specific optimizations */
    .a-enter-vr-button {
      background: #00a2ff !important;
      border-radius: 8px !important;
    }
  </style>
</head>
<body>
  <a-scene
    background="color: #000000"
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; sortTransparentObjects: true;"
    xr-mode-ui="enabled: true"
    vr-mode-ui="enterVRButton: true"
  >
    <!-- Enhanced lighting for VR clarity -->
    <a-entity light="type: ambient; intensity: 0.65; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 1.0; color: #ffffff" position="1 2 1"></a-entity>
    <a-entity light="type: directional; intensity: 0.5; color: #ffffff" position="-1 1 -1"></a-entity>

    <!-- Camera positioned INSIDE bronchi for consistent VR/desktop experience -->
    <a-entity id="rig" position="0 0.8 -0.3">
      <a-entity id="cam"
        camera="near: 0.001; far: 1500; fov: 80"
        look-controls="pointerLockEnabled: false; touchEnabled: true; mouseEnabled: true"
        wasd-controls="enabled: false"
        position="0 0 0">
      </a-entity>
    </a-entity>

    <!-- Bronchi model (.glb) -->
    <a-entity id="bronchi" gltf-model="../assets/models/bronchi.glb" visible="true"></a-entity>

    <!-- Multiple aerosol emitters to cover entire bronchial interior -->
    <a-entity id="aeroEmitterCenter"
              droplet-field="enabled: false; rate: 1200; life: 3500; sizeStart: 0.008; sizeEnd: 0.025;
                             speed: 0.85; speedJitter: 0.25;
                             sheetDist: 0.25; sheetWidth: 0.25; sheetHeight: 0.20; sheetDepth: 0.18;
                             swirl: 0.15; swirlHz: 1.2; lateral: 0.12; drag: 0.30; max: 1500">
    </a-entity>
    
    <a-entity id="aeroEmitterLeft"
              droplet-field="enabled: false; rate: 800; life: 3200; sizeStart: 0.007; sizeEnd: 0.022;
                             speed: 0.80; speedJitter: 0.28;
                             sheetDist: 0.22; sheetWidth: 0.18; sheetHeight: 0.16; sheetDepth: 0.14;
                             swirl: 0.18; swirlHz: 1.4; lateral: 0.15; drag: 0.32; max: 1000"
              position="-0.4 0.3 -0.2">
    </a-entity>
    
    <a-entity id="aeroEmitterRight"
              droplet-field="enabled: false; rate: 800; life: 3200; sizeStart: 0.007; sizeEnd: 0.022;
                             speed: 0.80; speedJitter: 0.28;
                             sheetDist: 0.22; sheetWidth: 0.18; sheetHeight: 0.16; sheetDepth: 0.14;
                             swirl: 0.18; swirlHz: 1.4; lateral: 0.15; drag: 0.32; max: 1000"
              position="0.4 0.3 -0.2">
    </a-entity>
    
    <a-entity id="aeroEmitterTop"
              droplet-field="enabled: false; rate: 600; life: 3000; sizeStart: 0.006; sizeEnd: 0.020;
                             speed: 0.75; speedJitter: 0.30;
                             sheetDist: 0.20; sheetWidth: 0.22; sheetHeight: 0.12; sheetDepth: 0.16;
                             swirl: 0.12; swirlHz: 1.1; lateral: 0.10; drag: 0.35; max: 800"
              position="0 0.6 -0.1">
    </a-entity>

    <!-- Click sound -->
    <audio id="click-sound" src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg"></audio>
  </a-scene>

  <div id="err"></div>

  <!-- Narration: auto-plays; auto-advance to Lung on end -->
  <audio id="narration" src="../assets/audio/bronchi_narration.mp3" autoplay preload="auto" playsinline></audio>

  <script>
    // --------- Error banner ----------
    function showError(msg){
      try{
        console.error(msg);
        const el=document.getElementById('err');
        el.textContent=String(msg);
        el.style.display='block';
      }catch(e){}
    }

    // --------- Enhanced VR Camera Positioning ----------
    (function(){
      let cameraPositioned = false;
      
      function positionCameraInsideBronchi() {
        if (cameraPositioned) return;
        
        const rig = document.getElementById('rig');
        if (rig) {
          // Position camera inside the bronchi (adjust based on your model)
          rig.setAttribute('position', '0 0.8 -0.3');
          console.log('Camera positioned inside bronchi for VR');
          cameraPositioned = true;
        }
      }

      // Position camera when scene loads and when entering VR
      const scene = document.querySelector('a-scene');
      scene.addEventListener('loaded', positionCameraInsideBronchi);
      scene.addEventListener('enter-vr', function() {
        setTimeout(positionCameraInsideBronchi, 100);
      });
      scene.addEventListener('exit-vr', positionCameraInsideBronchi);
    })();

    // --------- Soft sprite texture ----------
    function makeSoftDotTexture(){
      const R = 64;
      const c = document.createElement('canvas');
      c.width = c.height = R*2;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(R, R, 0, R, R, R);
      grd.addColorStop(0.0,'rgba(255,255,255,1.0)');
      grd.addColorStop(0.45,'rgba(255,255,255,0.7)');
      grd.addColorStop(0.80,'rgba(255,255,255,0.12)');
      grd.addColorStop(1.00,'rgba(255,255,255,0.0)');
      g.fillStyle = grd; g.fillRect(0,0,c.width,c.height);
      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 4; tex.needsUpdate = true;
      return tex;
    }

    // --------- Enhanced Volume particle field for full bronchial coverage ----------
    AFRAME.registerComponent('droplet-field',{
      schema:{
        enabled:{type:'boolean', default:false},
        rate:{type:'number', default:800},
        life:{type:'number', default:3000},
        sizeStart:{type:'number', default:0.008},
        sizeEnd:{type:'number', default:0.025},
        speed:{type:'number', default:0.85},
        speedJitter:{type:'number', default:0.25},
        lateral:{type:'number', default:0.08},
        sheetDist:{type:'number', default:0.25},
        sheetWidth:{type:'number', default:0.15},
        sheetHeight:{type:'number', default:0.12},
        sheetDepth:{type:'number', default:0.10},
        swirl:{type:'number', default:0.18},
        swirlHz:{type:'number', default:1.3},
        drag:{type:'number', default:0.35},
        max:{type:'number', default:1200}
      },
      init:function(){
        this.pool=[]; this.acc=0;
        this.el.object3D.updateMatrixWorld();
        const tex=makeSoftDotTexture();
        for(let i=0;i<this.data.max;i++){
          const mat=new THREE.SpriteMaterial({
            map:tex, color:0xffffff, transparent:true,
            depthWrite:false, blending:THREE.AdditiveBlending, opacity:0.0
          });
          const s=new THREE.Sprite(mat);
          s.visible=false; s.scale.setScalar(this.data.sizeStart);
          this.el.object3D.add(s);
          this.pool.push({
            obj:s, mat:mat, alive:false, t:0,
            vel:new THREE.Vector3(),
            forward:new THREE.Vector3(),
            right:new THREE.Vector3(),
            up:new THREE.Vector3(),
            phase: Math.random()*Math.PI*2,
            // Store emitter's world position for proper spawning
            emitterPos: new THREE.Vector3()
          });
        }
      },
      _getEmitterBasis:function(out){
        // Get the emitter's world position and orientation
        this.el.object3D.updateMatrixWorld();
        const worldPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(worldPos);
        
        // Create downward flow from emitter position
        out.forward.set(0, -1, 0).normalize();
        out.right.set(1, 0, 0).normalize();
        out.up.set(0, 0, 1).normalize();
        out.pos.copy(worldPos);
        return out;
      },
      spawnOne:function(){
        const d=this.data;
        const basis=this._basis||(this._basis={forward:new THREE.Vector3(),right:new THREE.Vector3(),up:new THREE.Vector3(),pos:new THREE.Vector3()});
        if(!this._getEmitterBasis(basis)) return;

        const slot=this.pool.find(p=>!p.alive); if(!slot) return;
        slot.alive=true; slot.t=0; slot.phase=Math.random()*Math.PI*2;

        const hw=d.sheetWidth*0.5, hh=d.sheetHeight*0.5, hd=d.sheetDepth*0.5;
        
        // Wider distribution for full bronchial coverage
        const ox=(Math.random()*2-1)*hw, oy=(Math.random()*2-1)*hh*0.3, oz=(Math.random()*2-1)*hd;

        const spawn=new THREE.Vector3()
          .copy(basis.pos)
          .addScaledVector(basis.forward, (Math.random()*2-1)*0.1)
          .addScaledVector(basis.right,  ox)
          .addScaledVector(basis.up,     oz);

        slot.obj.position.copy(spawn);
        slot.obj.scale.setScalar(d.sizeStart);
        slot.obj.visible=true; slot.mat.opacity=0.9;

        const sp=d.speed*(1+(Math.random()*2-1)*d.speedJitter);
        slot.vel.copy(basis.forward).multiplyScalar(Math.max(0.02, sp));
        slot.vel.addScaledVector(basis.right,(Math.random()*2-1)*d.lateral);
        slot.vel.addScaledVector(basis.up,(Math.random()*2-1)*d.lateral);
        
        // Store emitter position for this droplet
        slot.emitterPos.copy(basis.pos);
      },
      tick:function(time,dt){
        if(!dt) return;
        const d=this.data;
        if(d.enabled){
          this.acc+=dt;
          const interval=1000/Math.max(1e-4,d.rate);
          while(this.acc>=interval){ this.spawnOne(); this.acc-=interval; }
        }
        const dragFactor=Math.pow(1-THREE.MathUtils.clamp(d.drag,0,0.999), dt/1000);
        for(const p of this.pool){
          if(!p.alive) continue;
          p.t+=dt; const k=THREE.MathUtils.clamp(p.t/d.life,0,1);

          const t=(time*0.001);
          const swirlX=Math.sin((t+p.phase)*Math.PI*2*d.swirlHz)*d.swirl;
          const swirlY=Math.cos((t*0.8+p.phase*1.37)*Math.PI*2*d.swirlHz)*d.swirl;
          p.vel.addScaledVector(p.right, swirlX*(dt/1000));
          p.vel.addScaledVector(p.up,    swirlY*(dt/1000));

          p.vel.multiplyScalar(dragFactor);
          p.obj.position.addScaledVector(p.vel, dt/1000);

          const s=d.sizeStart*(1-k)+d.sizeEnd*k;
          p.obj.scale.set(s,s,1);
          p.mat.opacity=0.9*(1-k);

          if(k>=1){ p.alive=false; p.obj.visible=false; }
        }
      }
    });

    // --------- Sync ALL emitters to narration; auto-advance to Lung on end ----------
    (function(){
      const NEXT_URL = "../journeys/lungs_final.html?v=1";
      const audio = document.getElementById('narration');
      const emitters = [
        document.getElementById('aeroEmitterCenter'),
        document.getElementById('aeroEmitterLeft'),
        document.getElementById('aeroEmitterRight'),
        document.getElementById('aeroEmitterTop')
      ];

      function setAllDroplets(on){
        emitters.forEach(emitter => {
          try{ 
            if(emitter) {
              emitter.setAttribute('droplet-field','enabled', !!on); 
            }
          }catch(_){}
        });
      }
      
      function goNext(){ 
        setAllDroplets(false); 
        setTimeout(() => {
          window.location.href = NEXT_URL;
        }, 500);
      }

      function tryPlay(){
        const p = audio.play();
        if(p && typeof p.then==='function'){
          p.then(()=>{ 
            console.log('Narration started - activating all aerosol emitters');
            setAllDroplets(true); 
          })
           .catch((e)=>{ 
             console.log('Auto-play prevented, but emitters ready');
           });
        }else{
          setAllDroplets(true);
        }
      }

      if(audio){
        audio.addEventListener('play',  ()=> {
          console.log('Narration play event - starting aerosols');
          setAllDroplets(true);
        });
        audio.addEventListener('pause', ()=> setAllDroplets(false));
        audio.addEventListener('ended', goNext);

        tryPlay();
        const resumeOnce = ()=>{ 
          tryPlay(); 
          window.removeEventListener('pointerdown',resumeOnce); 
          window.removeEventListener('keydown',resumeOnce); 
        };
        window.addEventListener('pointerdown', resumeOnce, {once:true});
        window.addEventListener('keydown',     resumeOnce, {once:true});
      }
      
      // Debug controls
      window.addEventListener('keydown', (e) => {
        if(e.key === 'd' || e.key === 'D') {
          const currentlyEnabled = emitters[0]?.getAttribute('droplet-field')?.enabled;
          setAllDroplets(!currentlyEnabled);
          console.log('Toggled all emitters:', !currentlyEnabled);
        }
      });
    })();

    // --------- Keep native GLB materials; double-sided & no culling ----------
    (function () {
      const sceneEl = document.querySelector('a-scene');
      const modelEl = document.getElementById('bronchi');
      const camEl   = document.getElementById('cam');

      function ensureInsideVisibilityNoCulling(root) {
        root.traverse((node) => {
          if (node.isMesh) {
            node.frustumCulled = false;
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((m) => { if (m && 'side' in m) { m.side = THREE.DoubleSide; m.needsUpdate = true; }});
            try { if (node.geometry && !node.geometry.attributes.normal) node.geometry.computeVertexNormals(); } catch (_) {}
            node.renderOrder = 1;
          }
        });
      }

      function centerScaleAndPlaceCameraInside(root) {
        const bbox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3(); bbox.getSize(size);
        const center = new THREE.Vector3(); bbox.getCenter(center);

        console.log(`Bronchi size (m): ${size.x.toFixed(4)} ${size.y.toFixed(4)} ${size.z.toFixed(4)}`);

        root.position.sub(center);

        const halfMin = Math.max(1e-6, Math.min(size.x, size.y, size.z) * 0.5);
        const targetHalf = 0.7;
        const s = halfMin < targetHalf ? (targetHalf / halfMin) : 1.0;
        root.scale.multiplyScalar(s);

        ensureInsideVisibilityNoCulling(root);
      }

      if (sceneEl.renderer) { sceneEl.renderer.setClearColor(0x000000, 1); }
      else {
        sceneEl.addEventListener('render-target-loaded', () => {
          try { sceneEl.renderer.setClearColor(0x000000, 1); } catch (_) {}
        });
      }

      modelEl.addEventListener('model-error', (e) => {
        showError('Failed to load GLB at assets/models/bronchi.glb\n' +
                  (e && e.detail && e.detail.src ? `src: ${e.detail.src}\n` : '') +
                  (e && e.detail && e.detail.error ? `error: ${e.detail.error}` : ''));
      });

      modelEl.addEventListener('model-loaded', () => {
        try {
          const obj = modelEl.getObject3D('mesh');
          if (!obj) { showError('Model loaded, but no mesh found.'); return; }
          ensureInsideVisibilityNoCulling(obj);
          centerScaleAndPlaceCameraInside(obj);
          obj.traverse((n)=>{ if(n.isMesh) n.frustumCulled=false; });
          console.log('Bronchi model loaded - multiple aerosol emitters ready');
        } catch (e) {
          showError('Post-load processing failed:\n' + e.message);
        }
      });
    })();

    // Progress tracking
    (function() {
      const currentPage = window.location.pathname;
      
      // Set progress based on current page
      if (currentPage.includes('bronchi_final.html')) {
        localStorage.setItem('vaporJourneyProgress', 2);
      }
      
      console.log('Journey progress updated to:', localStorage.getItem('vaporJourneyProgress'));
    })();
  </script>
</body>
</html>
