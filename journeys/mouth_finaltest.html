<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lungs – Vaping Damage Educational VR Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body { 
      margin:0; 
      height:100%; 
      background:#000; 
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    
    #err {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      color: #fff;
      background: rgba(200, 0, 0, .25);
      font: 12px/1.4 monospace;
      padding: 6px 8px;
      display: none;
      z-index: 1000;
    }
    
    #factBox {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.92);
      width: min(560px, 88vw);
      max-height: 72vh;
      overflow: auto;
      background: rgba(10, 20, 30, .95);
      color: #e6f6ff;
      border: 1px solid #2aa9ff;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, .65);
      font: 14px/1.5 system-ui, Segoe UI, Roboto, sans-serif;
      opacity: 0;
      pointer-events: none;
      transition: all .28s ease;
      z-index: 999;
    }
    
    #factBox.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }
    
    #factBox h3 {
      margin: 0 0 6px 0;
      color: #86d5ff;
      font-size: 17px;
    }
    
    #factBox p {
      margin: 8px 0;
    }
    
    #factBox button {
      background: #0ea5e9;
      color: #001018;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    
    #latePrompt {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.92);
      width: min(600px, 92vw);
      background: rgba(16, 5, 5, .96);
      color: #ff6b6b;
      border: 2px solid #ff4444;
      border-radius: 14px;
      padding: 24px 24px 20px;
      box-shadow: 0 12px 36px rgba(255, 0, 0, .3);
      font: 16px/1.55 system-ui, Segoe UI, Roboto, sans-serif;
      text-align: center;
      display: none;
      animation: pulse 2s infinite;
      z-index: 1001;
    }
    
    @keyframes pulse {
      0% { border-color: #ff4444; box-shadow: 0 0 20px rgba(255, 0, 0, .3); }
      50% { border-color: #ff8888; box-shadow: 0 0 30px rgba(255, 0, 0, .5); }
      100% { border-color: #ff4444; box-shadow: 0 0 20px rgba(255, 0, 0, .3); }
    }
    
    #latePrompt h2 {
      margin: 0 0 12px 0;
      color: #ffaaaa;
      font-size: 24px;
      text-shadow: 0 0 10px rgba(255, 0, 0, .5);
    }
    
    #latePrompt p {
      margin: 8px 0 16px 0;
      color: #ffcccc;
      font-size: 18px;
    }
    
    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .btn {
      background: #ff4444;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
    }
    
    .btn:hover {
      background: #ff6666;
    }
    
    #bellNote {
      font: 12px/1.4 monospace;
      color: #9bdcff;
      opacity: .75;
      display: none;
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 1000;
    }
    
    #progress {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
      z-index: 1000;
    }
    
    #progressBar {
      height: 100%;
      width: 0%;
      background: #0ea5e9;
      transition: width 0.3s ease;
    }
    
    #sceneTitle {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-size: 24px;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
      z-index: 1000;
      pointer-events: none;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="sceneTitle">Inside Lung Alveoli - Vaping Damage</div>
  <div id="progress"><div id="progressBar"></div></div>
  
  <a-scene 
    background="color:#000000"
    renderer="antialias:true; colorManagement:true; physicallyCorrectLights:true; sortTransparentObjects:true;"
    vr-mode-ui="enabled:true">
    
    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 0.55"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="1 2 1"></a-entity>
    
    <!-- Camera with VR controls - NO INITIAL POSITION -->
    <a-entity id="cam" camera="near:0.001; far:1000; fov:80" look-controls wasd-controls>
      <a-entity id="mouseRay" cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 8; interval: 0"></a-entity>
    </a-entity>
    
    <!-- Lung model -->
    <a-entity id="lung" gltf-model="../assets/models/Lung.glb"></a-entity>
    
    <!-- Aerosol system -->
    <a-entity id="aeroEmitter"
      droplet-advect="enabled:true;
                      rate:520; max:1200; life:4600;
                      sizeStart:0.005; sizeEnd:0.014;
                      baseSpeed:0.42; accel:0.48; accelDown:0.12;
                      swirl:0.13; swirlHz:1.4; lateral:0.09; drag:0.34;
                      sheetDist:0.10; sheetWidth:0.26; sheetHeight:0.22; sheetDepth:0.14;
                      throatDist:1.10;
                      stickBase:0.52; stickSpeedK:0.28; stickFadeSec:18.0; maxDeposits:1000">
    </a-entity>
    
    <!-- Interactive hotspots -->
    <a-entity id="hotspots" visible="true">
      <a-entity id="hs-gas" ui-hotspot="color:#ff0000">
        <a-sphere class="clickable" radius="0.04" material="color:#fff; opacity:0.001; transparent:true"></a-sphere>
      </a-entity>
      <a-entity id="hs-mac" ui-hotspot="color:#ff0000">
        <a-sphere class="clickable" radius="0.04" material="color:#fff; opacity:0.001; transparent:true"></a-sphere>
      </a-entity>
      <a-entity id="hs-surf" ui-hotspot="color:#ff0000">
        <a-sphere class="clickable" radius="0.04" material="color:#fff; opacity:0.001; transparent:true"></a-sphere>
      </a-entity>
    </a-entity>
  </a-scene>

  <div id="err"></div>

  <!-- Fact modal -->
  <div id="factBox">
    <h3 id="factTitle"></h3>
    <div id="factText"></div>
    <button id="factClose">Close</button>
  </div>

  <!-- Late for class prompt -->
  <div id="latePrompt">
    <h2>⏰ HURRY, YOU'RE LATE FOR CLASS!</h2>
    <p>The bell has rung! Time to get to the classroom immediately!</p>
    <div class="row">
      <button class="btn" id="goNowBtn">GO TO CLASS NOW →</button>
    </div>
  </div>

  <div id="bellNote">Bell audio not found; showing prompt silently.</div>

  <!-- Audio -->
  <audio id="narration" src="../assets/audio/lung_narration.mp3" preload="auto" playsinline></audio>
  <audio id="bell" src="../assets/audio/school_bell.mp3" preload="auto"></audio>

  <script>
    function showError(msg){ 
      console.error(msg); 
      const el = document.getElementById('err'); 
      el.textContent = String(msg); 
      el.style.display = 'block'; 
    }

    /* ---------- Billboarded hotspot visuals ---------- */
    AFRAME.registerComponent('ui-hotspot', {
      schema: { 
        color: {type: 'string', default: '#ff0000'} 
      },
      init: function() {
        const root = new THREE.Group(); 
        root.renderOrder = 999; 
        this.el.object3D.add(root);
        
        const cnv = document.createElement('canvas'); 
        cnv.width = cnv.height = 128;
        const g = cnv.getContext('2d');
        
        g.fillStyle = this.data.color;
        g.globalAlpha = 0.8;
        g.beginPath();
        g.arc(64, 64, 44, 0, Math.PI * 2);
        g.fill();
        
        g.fillStyle = '#ffffff';
        g.globalAlpha = 1.0;
        g.font = 'bold 60px Arial';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText('i', 64, 64);
        
        const spriteMat = new THREE.SpriteMaterial({
          map: new THREE.CanvasTexture(cnv),
          depthTest: false,
          depthWrite: false,
          transparent: true,
          opacity: 0.95
        });
        
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(0.08, 0.08, 1);
        sprite.renderOrder = 1001;
        root.add(sprite);
        
        this._root = root;
        this._sprite = sprite;
        this._t0 = Math.random() * 1000;
      },
      tick: function(t) {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        
        const m = cam.matrixWorld;
        const look = new THREE.Vector3(m.elements[12], m.elements[13], m.elements[14]);
        this._root.lookAt(look);
        
        const k = 0.5 + 0.5 * Math.sin((t + this._t0) * 0.004);
        this._sprite.scale.set(0.08 + 0.02 * k, 0.08 + 0.02 * k, 1);
      }
    });

    /* ---------- Droplet advection system ---------- */
    AFRAME.registerComponent('droplet-advect', {
      schema: {
        enabled: {default: true},
        rate: {default: 520},
        max: {default: 1200},
        life: {default: 4600},
        sizeStart: {default: 0.005},
        sizeEnd: {default: 0.014},
        baseSpeed: {default: 0.42},
        accel: {default: 0.48},
        accelDown: {default: 0.12},
        swirl: {default: 0.13},
        swirlHz: {default: 1.4},
        lateral: {default: 0.09},
        drag: {default: 0.34},
        sheetDist: {default: 0.10},
        sheetWidth: {default: 0.26},
        sheetHeight: {default: 0.22},
        sheetDepth: {default: 0.14},
        throatDist: {default: 1.10},
        stickBase: {default: 0.52},
        stickSpeedK: {default: 0.28},
        stickFadeSec: {default: 18.0},
        maxDeposits: {default: 1000}
      },
      init: function() {
        this.pool = [];
        this.acc = 0;
        this.deposits = [];
        this.mesh = null;
        
        this.ray = new THREE.Raycaster();
        this.tmpV1 = new THREE.Vector3();
        this.tmpV2 = new THREE.Vector3();
        this.tmpV3 = new THREE.Vector3();
        this.tmpBasis = {
          forward: new THREE.Vector3(),
          right: new THREE.Vector3(),
          up: new THREE.Vector3(),
          pos: new THREE.Vector3()
        };
        this.flowBasis = null;
        
        const tex = (function() {
          const R = 64;
          const c = document.createElement('canvas');
          c.width = c.height = R * 2;
          const g = c.getContext('2d');
          const gr = g.createRadialGradient(R, R, 0, R, R, R);
          gr.addColorStop(0, 'rgba(255, 255, 255, 1)');
          gr.addColorStop(0.45, 'rgba(255, 255, 255, .85)');
          gr.addColorStop(0.8, 'rgba(255, 255, 255, .18)');
          gr.addColorStop(1, 'rgba(255, 255, 255, 0)');
          g.fillStyle = gr;
          g.fillRect(0, 0, c.width, c.height);
          const t = new THREE.CanvasTexture(c);
          t.anisotropy = 4;
          t.needsUpdate = true;
          return t;
        })();
        
        for (let i = 0; i < this.data.max; i++) {
          const mat = new THREE.SpriteMaterial({
            map: tex,
            color: 0xffffff,
            transparent: true,
            depthWrite: false,
            depthTest: true,
            blending: THREE.AdditiveBlending,
            opacity: 1.0
          });
          const s = new THREE.Sprite(mat);
          s.visible = false;
          s.scale.setScalar(this.data.sizeStart);
          this.el.object3D.add(s);
          this.pool.push({
            obj: s,
            mat: mat,
            alive: false,
            t: 0,
            vel: new THREE.Vector3(),
            prev: new THREE.Vector3(),
            phase: Math.random() * Math.PI * 2
          });
        }
        
        this.depositTex = tex;
        this.depositGroup = new THREE.Group();
        this.el.object3D.add(this.depositGroup);
        
        const lungEl = document.getElementById('lung');
        const attach = () => {
          const m = lungEl && lungEl.getObject3D('mesh');
          if (m) {
            this.mesh = m;
          }
        };
        
        if (lungEl) {
          lungEl.addEventListener('model-loaded', attach);
          attach();
        }
        
        this.el.sceneEl.addEventListener('loaded', () => this._snapshotFlowBasis());
        setTimeout(() => this._snapshotFlowBasis(), 500);
      },
      
      _snapshotFlowBasis: function() {
        const cam = document.getElementById('cam');
        if (!cam) return;
        
        const m = cam.object3D.matrixWorld;
        this.flowBasis = {
          forward: new THREE.Vector3(-m.elements[8], -m.elements[9], -m.elements[10]).normalize(),
          right: new THREE.Vector3(m.elements[0], m.elements[1], m.elements[2]).normalize(),
          up: new THREE.Vector3(m.elements[4], m.elements[5], m.elements[6]).normalize(),
          pos: new THREE.Vector3(m.elements[12], m.elements[13], m.elements[14])
        };
      },
      
      _cameraBasis: function(out) {
        const cam = document.getElementById('cam');
        if (!cam) return null;
        
        const m = cam.object3D.matrixWorld;
        out.forward.set(-m.elements[8], -m.elements[9], -m.elements[10]).normalize();
        out.right.set(m.elements[0], m.elements[1], m.elements[2]).normalize();
        out.up.set(m.elements[4], m.elements[5], m.elements[6]).normalize();
        out.pos.set(m.elements[12], m.elements[13], m.elements[14]);
        return out;
      },
      
      _spawnOne: function() {
        const d = this.data;
        const basis = this.tmpBasis;
        if (!this._cameraBasis(basis)) return;
        
        const slot = this.pool.find(p => !p.alive);
        if (!slot) return;
        
        slot.alive = true;
        slot.t = 0;
        slot.phase = Math.random() * Math.PI * 2;
        
        const hw = d.sheetWidth * 0.5;
        const hh = d.sheetHeight * 0.5;
        const hd = d.sheetDepth * 0.5;
        const ox = (Math.random() * 2 - 1) * hw;
        const oy = (Math.random() * 2 - 1) * hh;
        const oz = d.sheetDist + (Math.random() * 2 - 1) * hd;
        
        const spawn = new THREE.Vector3()
          .copy(basis.pos)
          .addScaledVector(basis.forward, oz)
          .addScaledVector(basis.right, ox)
          .addScaledVector(basis.up, oy);
        
        slot.obj.position.copy(spawn);
        slot.prev.copy(spawn);
        slot.obj.visible = true;
        slot.obj.scale.setScalar(d.sizeStart);
        slot.mat.opacity = 1.0;
        
        slot.vel.copy(this.flowBasis ? this.flowBasis.forward : basis.forward)
          .multiplyScalar(d.baseSpeed * (0.9 + 0.35 * Math.random()));
        slot.vel.addScaledVector(basis.right, (Math.random() * 2 - 1) * d.lateral);
        slot.vel.addScaledVector(basis.up, (Math.random() * 2 - 1) * d.lateral);
      },
      
      _maybeStick: function(_pt, speed) {
        const d = this.data;
        const p = d.stickBase + d.stickSpeedK * Math.max(0, 0.6 - speed);
        return Math.random() < THREE.MathUtils.clamp(p, 0, 0.98);
      },
      
      _addDeposit: function(pos, normal) {
        const d = this.data;
        
        while (this.deposits.length > d.maxDeposits) {
          const old = this.deposits.shift();
          this.depositGroup.remove(old.obj);
        }
        
        const mat = new THREE.SpriteMaterial({
          map: this.depositTex,
          color: 0xffffff,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          opacity: 0.95
        });
        const s = new THREE.Sprite(mat);
        s.scale.set(0.0065, 0.0065, 1);
        
        const n = normal ? normal.clone().normalize() : new THREE.Vector3(0, 0, 1);
        s.position.copy(pos).add(n.multiplyScalar(0.0015));
        
        this.depositGroup.add(s);
        this.deposits.push({
          obj: s,
          mat: mat,
          t: 0,
          life: d.stickFadeSec * 1000
        });
      },
      
      _step: function(p, dtMs, time) {
        const d = this.data;
        const dt = dtMs / 1000;
        const basis = this.flowBasis || this.tmpBasis;
        
        if (!basis.forward.lengthSq()) {
          this._snapshotFlowBasis();
        }
        
        p.vel.addScaledVector(basis.forward, d.accel * dt);
        p.vel.addScaledVector(basis.up, -d.accelDown * dt);
        
        const swirlX = Math.sin((time * 0.001 + p.phase) * Math.PI * 2 * d.swirlHz) * d.swirl;
        const swirlY = Math.cos((time * 0.0009 + p.phase * 1.37) * Math.PI * 2 * d.swirlHz) * d.swirl;
        p.vel.x += swirlX * dt;
        p.vel.y += swirlY * dt;
        
        const drag = Math.pow(1 - THREE.MathUtils.clamp(d.drag, 0, 0.999), dt);
        p.vel.multiplyScalar(drag);
        
        const next = this.tmpV1.copy(p.obj.position).addScaledVector(p.vel, dt);
        
        if (this.mesh) {
          const dir = this.tmpV2.copy(next).sub(p.prev);
          const dist = dir.length();
          
          if (dist > 0) {
            dir.normalize();
            this.ray.set(p.prev, dir);
            this.ray.far = dist + 0.002;
            
            const hits = this.ray.intersectObject(this.mesh, true);
            
            if (hits && hits.length) {
              const h = hits[0];
              const sp = p.vel.length();
              
              const n = h.face && h.face.normal ? 
                this.tmpV3.copy(h.face.normal).transformDirection(h.object.matrixWorld) : 
                null;
              
              if (this._maybeStick(h.point, sp)) {
                this._addDeposit(h.point, n);
                p.alive = false;
                p.obj.visible = false;
                return;
              } else {
                if (n) {
                  const v = p.vel;
                  const r = v.clone().sub(n.clone().multiplyScalar(2 * v.dot(n)));
                  v.copy(r).multiplyScalar(0.25);
                } else {
                  p.vel.multiplyScalar(0.2);
                }
                
                p.obj.position.copy(h.point).addScaledVector(dir, -0.002);
                p.prev.copy(p.obj.position);
                return;
              }
            }
          }
        }
        
        p.obj.position.copy(next);
        p.prev.copy(next);
        
        const fromCam = this.tmpV2.copy(p.obj.position)
          .sub((this.flowBasis && this.flowBasis.pos) || this.tmpBasis.pos);
        const along = fromCam.dot((this.flowBasis && this.flowBasis.forward) || this.tmpBasis.forward);
        
        if (along < -d.throatDist) {
          p.alive = false;
          p.obj.visible = false;
        }
      },
      
      tick: function(time, dt) {
        if (!dt) return;
        
        const d = this.data;
        
        if (d.enabled) {
          this.acc += dt;
          const interval = 1000 / Math.max(0.0001, d.rate);
          
          while (this.acc >= interval) {
            this._spawnOne();
            this.acc -= interval;
          }
        }
        
        for (const p of this.pool) {
          if (!p.alive) continue;
          
          p.t += dt;
          const k = THREE.MathUtils.clamp(p.t / d.life, 0, 1);
          
          const s = d.sizeStart * (1 - k) + d.sizeEnd * k;
          p.obj.scale.set(s, s, 1);
          p.mat.opacity = 0.95 * (1 - k);
          
          this._step(p, dt, time);
          
          if (k >= 1) {
            p.alive = false;
            p.obj.visible = false;
          }
        }
        
        for (let i = this.deposits.length - 1; i >= 0; i--) {
          const dep = this.deposits[i];
          dep.t += dt;
          const r = dep.t / dep.life;
          
          if (r >= 1) {
            this.depositGroup.remove(dep.obj);
            this.deposits.splice(i, 1);
          } else {
            dep.mat.opacity = 0.95 * (1 - r);
          }
        }
      }
    });

    /* ---------- SIMPLIFIED SCENE SETUP - FORCE INTERNAL POV ---------- */
    (function() {
      const modelEl = document.getElementById('lung');
      const cam = document.getElementById('cam');
      
      function fixMaterials(root) {
        root.traverse((n) => {
          if (n.isMesh) {
            n.frustumCulled = false;
            const mats = Array.isArray(n.material) ? n.material : [n.material];
            
            mats.forEach(m => {
              if (m && 'side' in m) {
                m.side = THREE.DoubleSide;
                m.needsUpdate = true;
              }
            });
            
            n.renderOrder = 1;
          }
        });
      }
      
      function positionCameraInside() {
        // FORCE camera to be inside the lung
        // Position camera deep inside where alveoli would be
        cam.object3D.position.set(0, 0.3, 0.2);
        
        // Make lung large and position it around camera
        const lungObj = modelEl.getObject3D('mesh');
        if (lungObj) {
          lungObj.position.set(0, 0, 0);
          lungObj.scale.set(2.5, 2.5, 2.5);
        }
        
        console.log('CAMERA POSITION FORCED INSIDE LUNG:', cam.object3D.position);
      }
      
      function positionHotspotsInside() {
        // Position hotspots at interior locations relative to camera
        const camPos = cam.object3D.position;
        
        // Alveoli hotspot - slightly forward and up
        document.getElementById('hs-gas').object3D.position.set(
          camPos.x - 0.2, camPos.y + 0.1, camPos.z + 0.4
        );
        
        // Macrophage hotspot - to the right
        document.getElementById('hs-mac').object3D.position.set(
          camPos.x + 0.3, camPos.y + 0.05, camPos.z + 0.3
        );
        
        // Surfactant hotspot - to the left and down
        document.getElementById('hs-surf').object3D.position.set(
          camPos.x - 0.25, camPos.y - 0.2, camPos.z + 0.5
        );
        
        console.log('Hotspots positioned around interior camera');
      }
      
      modelEl.addEventListener('model-error', () => {
        showError('Failed to load GLB at assets/models/Lung.glb');
      });
      
      modelEl.addEventListener('model-loaded', () => {
        try {
          const obj = modelEl.getObject3D('mesh');
          if (!obj) {
            showError('Model loaded, but no mesh found.');
            return;
          }
          
          fixMaterials(obj);
          
          // Wait a frame then force camera positioning
          setTimeout(() => {
            positionCameraInside();
            positionHotspotsInside();
          }, 100);
          
        } catch (e) {
          showError(e.message);
        }
      });
      
      // Also try to position on scene load as backup
      document.querySelector('a-scene').addEventListener('loaded', () => {
        setTimeout(() => {
          if (modelEl.getObject3D('mesh')) {
            positionCameraInside();
            positionHotspotsInside();
          }
        }, 500);
      });
    })();

    /* ---------- Fact popup system ---------- */
    (function() {
      const facts = {
        'hs-gas': {
          title: 'Alveoli: Gas Exchange Damage',
          text: `Alveoli are thin-walled sacs where oxygen diffuses into blood and CO₂ exits. 
Vaping aerosols deposit harmful chemicals that thicken the air–blood barrier, 
reducing surface area for gas exchange and causing shortness of breath.`
        },
        'hs-mac': {
          title: 'Popcorn Lung (Bronchiolitis Obliterans)',
          text: `Diacetyl, a flavoring chemical in many vape liquids, can cause 
bronchiolitis obliterans - irreversible scarring of the smallest airways. 
This "popcorn lung" severely limits airflow and cannot be cured.`
        },
        'hs-surf': {
          title: 'Reduced Lung Capacity & COPD Risk',
          text: `Chronic vaping damages lung tissue, reduces elasticity, and 
increases inflammation. This leads to decreased lung capacity and 
significantly raises the risk of developing COPD (Chronic Obstructive Pulmonary Disease).`
        }
      };
      
      const box = document.getElementById('factBox');
      const title = document.getElementById('factTitle');
      const text = document.getElementById('factText');
      const close = document.getElementById('factClose');
      
      function open(key) {
        const f = facts[key];
        if (!f) return;
        
        title.textContent = f.title;
        text.textContent = f.text;
        box.classList.add('show');
      }
      
      function closeBox() {
        box.classList.remove('show');
      }
      
      close.addEventListener('click', closeBox);
      
      ['hs-gas', 'hs-mac', 'hs-surf'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('click', () => open(id));
      });
    })();

    /* ---------- Narration and scene transition ---------- */
    (function() {
      const audio = document.getElementById('narration');
      const bell = document.getElementById('bell');
      const latePrompt = document.getElementById('latePrompt');
      const goNowBtn = document.getElementById('goNowBtn');
      const bellNote = document.getElementById('bellNote');
      const progressBar = document.getElementById('progressBar');
      
      audio.addEventListener('timeupdate', () => {
        const progress = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = `${progress}%`;
      });
      
      function goToClassroom() {
        console.log('NAVIGATING TO: /classroom_scene.html');
        window.location.href = "/classroom_scene.html";
      }
      
      function showLatePrompt() {
        console.log('Showing LATE FOR CLASS prompt');
        latePrompt.style.display = 'block';
      }
      
      function startNarration() {
        console.log('Starting lung narration');
        const playPromise = audio.play();
        
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.log('Auto-play prevented, showing manual play instructions');
            showError('Click to start narration');
            
            document.body.addEventListener('click', function startOnce() {
              audio.play();
              document.body.removeEventListener('click', startOnce);
            }, {once: true});
          });
        }
      }
      
      audio.addEventListener('ended', () => {
        console.log('Lung narration ended');
        
        if (bell && bell.play) {
          const bellPromise = bell.play();
          
          if (bellPromise !== undefined) {
            bellPromise
              .then(() => {
                console.log('Bell audio playing');
                setTimeout(showLatePrompt, 800);
              })
              .catch(() => {
                console.log('Bell audio blocked, showing prompt silently');
                bellNote.style.display = 'block';
                setTimeout(showLatePrompt, 800);
              });
          }
        } else {
          console.log('Bell audio not available, showing prompt silently');
          bellNote.style.display = 'block';
          setTimeout(showLatePrompt, 800);
        }
      });
      
      goNowBtn.addEventListener('click', goToClassroom);
      
      window.addEventListener('load', () => {
        setTimeout(startNarration, 1000);
      });
    })();
  </script>
</body>
</html>
