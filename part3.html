<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vaporized — Track Practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    font-family: system-ui, Segoe UI, Arial;
    overflow: hidden;
  }

  #videoStage {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #trackVideo {
    width: 100%;
    height: 100vh;
    object-fit: contain;
    background: #000;
  }

  #skipVideo {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #23c2ff;
    color: #001;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
  }

  #skipVideo:hover {
    background: #1ea5e0;
  }

  #continueBtn {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #4CAF50;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    display: none;
    font-weight: bold;
  }

  #continueBtn:hover {
    background: #45a049;
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    z-index: 1000;
  }
</style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div>Loading Track Video...</div>
  </div>

  <!-- Video Stage -->
  <div id="videoStage" style="display: none;">
    <video id="trackVideo" preload="auto" playsinline></video>
    <button id="skipVideo">Skip Video</button>
    <button id="continueBtn">Start Track Practice</button>
  </div>

<script>
// DOM Elements
const videoStage = document.getElementById('videoStage');
const trackVideo = document.getElementById('trackVideo');
const skipVideo = document.getElementById('skipVideo');
const continueBtn = document.getElementById('continueBtn');
const loading = document.getElementById('loading');

// Track video path
const TRACK_VIDEO_PATH = 'assets/video/Track.mp4';

function startTrackGame() {
  console.log('🎯 Starting 3D track game...');
  // Replace this with your actual 3D track game URL
  window.location.href = 'track_game.html'; // Change to your actual game file
}

function showVideoStage() {
  loading.style.display = 'none';
  videoStage.style.display = 'flex';
}

function setupVideo() {
  // Set up video
  trackVideo.src = TRACK_VIDEO_PATH;
  trackVideo.loop = false;
  
  // When video ends, show continue button
  trackVideo.addEventListener('ended', () => {
    console.log('🏁 Track video ended');
    continueBtn.style.display = 'block';
    skipVideo.style.display = 'none';
  });
  
  // Handle video errors
  trackVideo.addEventListener('error', (error) => {
    console.error('❌ Track video failed to load:', error);
    showVideoStage();
    continueBtn.style.display = 'block';
    skipVideo.style.display = 'none';
  });
  
  // Skip video button
  skipVideo.addEventListener('click', () => {
    trackVideo.pause();
    continueBtn.style.display = 'block';
    skipVideo.style.display = 'none';
  });
  
  // Continue to track game
  continueBtn.addEventListener('click', startTrackGame);
  
  // Try to autoplay video
  showVideoStage();
  trackVideo.play().catch(error => {
    console.log('Video autoplay blocked, user interaction required');
    // Video will play when user interacts with skip button
  });
}

// Initialize when page loads
window.addEventListener('load', function() {
  console.log('🎬 Loading Track video...');
  setupVideo();
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    startTrackGame(); // Skip to game
  }
  if (e.key === ' ' || e.key === 'Enter') {
    if (continueBtn.style.display === 'block') {
      startTrackGame(); // Continue to game
    }
  }
});
</script>
</body>
</html>
