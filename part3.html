<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vaporized — Track Practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    font-family: system-ui, Segoe UI, Arial;
    overflow: hidden;
  }

  #videoStage {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #trackVideo {
    width: 100%;
    height: 100vh;
    object-fit: contain;
    background: #000;
  }

  #skipVideo {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #23c2ff;
    color: #001;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
  }

  #skipVideo:hover {
    background: #1ea5e0;
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    z-index: 1000;
  }
</style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div>Loading Track Video...</div>
  </div>

  <!-- Video Stage - ONLY has video and skip button -->
  <div id="videoStage" style="display: none;">
    <video id="trackVideo" preload="auto" playsinline></video>
    <button id="skipVideo">Skip Video</button>
    <!-- NO CONTINUE BUTTON HERE -->
  </div>

<script>
// DOM Elements
const videoStage = document.getElementById('videoStage');
const trackVideo = document.getElementById('trackVideo');
const skipVideo = document.getElementById('skipVideo');
const loading = document.getElementById('loading');

// Track video path
const TRACK_VIDEO_PATH = 'assets/video/Track.mp4';

function startTrackGame() {
  console.log('Transitioning to track game...');
  window.location.href = 'track_game.html';
}

function showVideoStage() {
  loading.style.display = 'none';
  videoStage.style.display = 'flex';
}

function setupVideo() {
  // Set up video
  trackVideo.src = TRACK_VIDEO_PATH;
  trackVideo.loop = false;
  
  // When video ends, AUTO-REDIRECT immediately
  trackVideo.addEventListener('ended', () => {
    console.log('Video ended - AUTO-REDIRECTING to track game');
    startTrackGame();
  });
  
  // Handle video errors
  trackVideo.addEventListener('error', (error) => {
    console.error('Video failed to load:', error);
    startTrackGame();
  });
  
  // Skip video button
  skipVideo.addEventListener('click', () => {
    console.log('Video skipped');
    startTrackGame();
  });
  
  // Try to autoplay video
  showVideoStage();
  trackVideo.play().catch(error => {
    console.log('Video autoplay blocked');
  });
}

// Initialize when page loads
window.addEventListener('load', function() {
  console.log('Loading track video...');
  setupVideo();
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter') {
    startTrackGame();
  }
});
</script>
</body>
</html>
