<!-- Alternative: 180° 3D Experience -->
<a-scene vr-mode-ui="enabled: true">
    <!-- Large curved screen with your 2D video -->
    <a-cylinder id="video-screen" src="assets/track-runner-struggle.mp4" 
                theta-length="180" radius="10" height="6" 
                position="0 2 -9" rotation="0 90 0" autoplay="true">
    </a-cylinder>
    
    <!-- You're standing on the track -->
    <a-circle id="track-floor" radius="20" rotation="-90 0 0" color="#8B4513" position="0 0 0"></a-circle>
    
    <!-- 3D elements around you -->
    <a-entity id="track-elements">
        <a-cylinder color="#4682B4" radius="0.3" height="1.8" position="-2 0.9 5"></a-cylinder>
        <a-cylinder color="#4682B4" radius="0.3" height="1.8" position="3 0.9 3"></a-cylinder>
    </a-entity>
</a-scene>
