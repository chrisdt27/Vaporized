<!DOCTYPE html>
<html>
<head>
    <title>Track Runner Vaping Impact - Immersive 3D Experience</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .health-ui {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            font-family: Arial, sans-serif;
        }
        .metric {
            margin: 10px 0;
            padding: 8px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <a-scene 
        vr-mode-ui="enabled: true"
        device-orientation-permission-ui="enabled: true"
        background="color: #1E90FF"
    >

        <!-- 360° VIDEO SPHERE - You're INSIDE the video -->
        <a-videosphere 
            src="assets/track-runner-struggle-360.mp4"
            rotation="0 90 0"
            radius="50"
            autoplay="true"
            id="main-video">
        </a-videosphere>

        <!-- 3D TRACK ELEMENTS (overlaid on video) -->
        <a-entity id="interactive-elements">
            <!-- Running track overlay -->
            <a-ring color="#8B4513" radius-inner="48" radius-outer="49" rotation="-90 0 0" opacity="0.3"></a-ring>
            
            <!-- Breath particles (visualize struggling) -->
            <a-entity id="breath-particles" particle-system="preset: dust; color: #87CEEB; particleCount: 100"></a-entity>
            
            <!-- Other runners (3D models) -->
            <a-entity id="other-runners">
                <a-cylinder color="#4682B4" radius="0.3" height="1.8" position="-5 0.9 -48"></a-cylinder>
                <a-cylinder color="#4682B4" radius="0.3" height="1.8" position="3 0.9 -45"></a-cylinder>
                <a-cylinder color="#4682B4" radius="0.3" height="1.8" position="-2 0.9 -42"></a-cylinder>
            </a-entity>
        </a-entity>

        <!-- HEALTH METRICS (floating in 3D space) -->
        <a-entity id="health-metrics" position="0 2 -2">
            <a-plane color="rgba(0,0,0,0.8)" width="2.5" height="1.5" position="0 0 0"></a-plane>
            <a-text value="YOUR VITAL SIGNS" position="0 0.6 0.01" color="white" align="center"></a-text>
            <a-text value="OXYGEN: 100%" id="oxygen-display" position="-0.8 0.2 0.01" color="#87CEEB" align="left"></a-text>
            <a-text value="HEART RATE: 120" id="heartrate-display" position="-0.8 -0.1 0.01" color="#FF6B6B" align="left"></a-text>
            <a-text value="PERFORMANCE: 100%" id="performance-display" position="-0.8 -0.4 0.01" color="#4CAF50" align="left"></a-text>
        </a-entity>

        <!-- LUNG VISUALIZATION (3D model that changes) -->
        <a-entity id="lung-display" position="2 1.5 -1.5">
            <a-text value="YOUR LUNGS" position="0 0.8 0" color="white" align="center"></a-text>
            <a-sphere color="#87CEEB" radius="0.3" id="left-lung" position="-0.2 0 0" 
                     animation="property: scale; dir: alternate; loop: true; dur: 2000; to: 1.2 1.2 1.2">
            </a-sphere>
            <a-sphere color="#87CEEB" radius="0.3" id="right-lung" position="0.2 0 0"
                     animation="property: scale; dir: alternate; loop: true; dur: 2000; to: 1.2 1.2 1.2">
            </a-sphere>
        </a-entity>

        <!-- INTERACTIVE CONTROLS -->
        <a-entity id="vr-controls">
            <a-entity laser-controls="hand: right"></a-entity>
            <a-entity laser-controls="hand: left"></a-entity>
            <a-entity hand-controls="hand: left"></a-entity>
            <a-entity hand-controls="hand: right"></a-entity>
        </a-entity>

        <!-- CAMERA RIG -->
        <a-entity id="camera-rig" movement-controls="controls: gamepad, keyboard">
            <a-entity camera look-controls position="0 1.6 0" wasd-controls="fly: true"></a-entity>
        </a-entity>

        <!-- AUDIO -->
        <audio id="breathing-audio" src="assets/breathing-progressive.mp3" preload="auto"></audio>
        <audio id="coughing-audio" src="assets/coughing-fit.mp3" preload="auto"></audio>
        <audio id="crowd-audio" src="assets/stadium-crowd.mp3" preload="auto" loop="true"></audio>

    </a-scene>

    <!-- HEALTH STATUS UI -->
    <div class="health-ui">
        <h3>🏃‍♂️ Your Body's Response</h3>
        <div class="metric" style="background: rgba(255,107,107,0.3);">
            <strong>Lung Capacity:</strong> <span id="lung-capacity-ui">100%</span>
        </div>
        <div class="metric" style="background: rgba(76,175,80,0.3);">
            <strong>Running Pace:</strong> <span id="pace-ui">100%</span>
        </div>
        <div class="metric" style="background: rgba(135,206,235,0.3);">
            <strong>Oxygen Intake:</strong> <span id="oxygen-ui">100%</span>
        </div>
        <p>Look around - you're on the track!</p>
    </div>

    <script>
        // Immersive Experience State
        const experience = {
            currentTime: 0,
            healthMetrics: {
                oxygen: 100,
                heartRate: 120,
                performance: 100,
                lungCapacity: 100
            },
            videoDuration: 30, // seconds
            effectsActive: false
        };

        // Initialize A-Frame Components
        AFRAME.registerComponent('health-tracker', {
            init: function() {
                this.video = document.querySelector('#main-video');
                this.breathingAudio = document.querySelector('#breathing-audio');
                this.coughingAudio = document.querySelector('#coughing-audio');
                this.crowdAudio = document.querySelector('#crowd-audio');
                
                // Start ambient audio
                this.crowdAudio.volume = 0.3;
                this.crowdAudio.play().catch(e => console.log('Audio requires interaction'));
            },
            tick: function(time, delta) {
                if (!this.video) return;
                
                // Simulate video progress (since we can't get currentTime from videosphere easily)
                experience.currentTime += delta / 1000;
                
                // Progressive health deterioration
                this.updateHealthMetrics();
                this.applyVisualEffects();
                this.updateAudio();
            },
            updateHealthMetrics: function() {
                const progress = experience.currentTime / experience.videoDuration;
                
                // Progressive deterioration
                experience.healthMetrics.oxygen = Math.max(40, 100 - (progress * 60));
                experience.healthMetrics.heartRate = Math.min(180, 120 + (progress * 60));
                experience.healthMetrics.performance = Math.max(30, 100 - (progress * 70));
                experience.healthMetrics.lungCapacity = Math.max(35, 100 - (progress * 65));
                
                // Update displays
                this.updateDisplays();
            },
            applyVisualEffects: function() {
                const lungs = document.querySelectorAll('#left-lung, #right-lung');
                const breathParticles = document.querySelector('#breath-particles');
                
                // Lung color changes
                const oxygenLevel = experience.healthMetrics.oxygen;
                let lungColor = '#87CEEB'; // Healthy blue
                
                if (oxygenLevel < 70) lungColor = '#FFA500'; // Warning orange
                if (oxygenLevel < 50) lungColor = '#FF6B6B'; // Danger red
                if (oxygenLevel < 40) lungColor = '#8B4513'; // Critical brown
                
                lungs.forEach(lung => {
                    lung.setAttribute('color', lungColor);
                    // Reduce breathing animation as oxygen decreases
                    const scale = 1.0 + (oxygenLevel / 200);
                    lung.setAttribute('scale', `${scale} ${scale} ${scale}`);
                });
                
                // Breath particles become more labored
                if (oxygenLevel < 60 && !experience.effectsActive) {
                    breathParticles.setAttribute('particle-system', 'particleCount: 300; color: #696969');
                    experience.effectsActive = true;
                }
            },
            updateAudio: function() {
                const oxygenLevel = experience.healthMetrics.oxygen;
                
                // Progressive breathing difficulty
                if (oxygenLevel < 70 && this.breathingAudio.paused) {
                    this.breathingAudio.volume = 0.7;
                    this.breathingAudio.play().catch(e => console.log('Audio interaction needed'));
                }
                
                // Trigger coughing fits
                if (oxygenLevel < 50 && !this.coughingTriggered) {
                    this.coughingAudio.volume = 0.8;
                    this.coughingAudio.play().catch(e => console.log('Audio interaction needed'));
                    this.coughingTriggered = true;
                    
                    // Reset after delay
                    setTimeout(() => {
                        this.coughingTriggered = false;
                    }, 5000);
                }
            },
            updateDisplays: function() {
                // 3D Text displays
                document.querySelector('#oxygen-display').setAttribute('value', 
                    `OXYGEN: ${Math.round(experience.healthMetrics.oxygen)}%`);
                document.querySelector('#heartrate-display').setAttribute('value', 
                    `HEART RATE: ${Math.round(experience.healthMetrics.heartRate)}`);
                document.querySelector('#performance-display').setAttribute('value', 
                    `PERFORMANCE: ${Math.round(experience.healthMetrics.performance)}%`);
                
                // UI displays
                document.querySelector('#lung-capacity-ui').textContent = 
                    `${Math.round(experience.healthMetrics.lungCapacity)}%`;
                document.querySelector('#pace-ui').textContent = 
                    `${Math.round(experience.healthMetrics.performance)}%`;
                document.querySelector('#oxygen-ui').textContent = 
                    `${Math.round(experience.healthMetrics.oxygen)}%`;
                
                // Color coding for urgency
                const oxygenUI = document.querySelector('#oxygen-display');
                if (experience.healthMetrics.oxygen < 50) {
                    oxygenUI.setAttribute('color', '#FF4444');
                } else if (experience.healthMetrics.oxygen < 70) {
                    oxygenUI.setAttribute('color', '#FFA500');
                }
            }
        });

        // Add health tracking to scene
        document.querySelector('a-scene').setAttribute('health-tracker', '');

        // Interactive controller for "feeling" the struggle
        AFRAME.registerComponent('struggle-controller', {
            init: function() {
                this.el.addEventListener('gripdown', () => {
                    this.simulateStruggle();
                });
            },
            simulateStruggle: function() {
                // Haptic feedback for Oculus controllers
                if (this.el.components['haptic']) {
                    this.el.components.haptic.pulse(0.8, 200);
                }
                
                // Visual struggle effect
                const camera = document.querySelector('[camera]');
                camera.setAttribute('animation', {
                    property: 'position',
                    to: `${Math.random() * 0.1} 1.6 ${Math.random() * 0.1}`,
                    dur: 100,
                    easing: 'easeInOut'
                });
            }
        });

        // Add struggle effect to controllers
        document.querySelectorAll('[hand-controls]').forEach(controller => {
            controller.setAttribute('struggle-controller', '');
        });

        // Reset experience when video ends
        function resetExperience() {
            experience.currentTime = 0;
            experience.healthMetrics = {
                oxygen: 100,
                heartRate: 120,
                performance: 100,
                lungCapacity: 100
            };
            experience.effectsActive = false;
            
            // Reset visual elements
            const lungs = document.querySelectorAll('#left-lung, #right-lung');
            lungs.forEach(lung => {
                lung.setAttribute('color', '#87CEEB');
                lung.setAttribute('scale', '1 1 1');
            });
            
            document.querySelector('#breath-particles').setAttribute('particle-system', 'particleCount: 100');
        }

        // Auto-reset after video duration
        setInterval(() => {
            if (experience.currentTime >= experience.videoDuration) {
                resetExperience();
            }
        }, 1000);

        // Keyboard controls for testing
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r') resetExperience();
            if (e.key === ' ') {
                // Simulate struggle
                experience.healthMetrics.oxygen = Math.max(20, experience.healthMetrics.oxygen - 10);
            }
        });

        // Instructions for Oculus
        setTimeout(() => {
            const instructionEl = document.createElement('a-text');
            instructionEl.setAttribute('value', 'Look around 360°\nSqueeze controllers to feel the struggle\nWatch your vital signs decline');
            instructionEl.setAttribute('position', '0 3 -1.5');
            instructionEl.setAttribute('align', 'center');
            instructionEl.setAttribute('color', '#FFD700');
            instructionEl.setAttribute('scale', '1.2 1.2 1.2');
            document.querySelector('a-scene').appendChild(instructionEl);
            
            setTimeout(() => {
                document.querySelector('a-scene').removeChild(instructionEl);
            }, 8000);
        }, 2000);
    </script>
</body>
</html>
